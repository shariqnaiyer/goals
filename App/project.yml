# XcodeGen project spec — generate the .xcodeproj with:  xcodegen generate
# (run from the App/ directory). Committing this rather than a hand-written
# .xcodeproj keeps project config reviewable and reproducible (a standard
# practice on iOS teams). See SETUP.md for full instructions.
name: Goals
options:
  bundleIdPrefix: com.example.goals
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoalsCore:
    path: ../Packages/GoalsCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    LLM_PROXY_BASE_URL: ""   # overridden by Secrets.xcconfig when present
  configs:
    Debug:
      "#include?": "Goals/Resources/Secrets.xcconfig"
    Release:
      "#include?": "Goals/Resources/Secrets.xcconfig"

targets:
  Goals:
    type: application
    platform: iOS
    sources:
      - path: Goals
    dependencies:
      - package: GoalsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.goals
        INFOPLIST_FILE: Goals/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
