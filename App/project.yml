# XcodeGen project spec — generate the .xcodeproj with:  xcodegen generate
# (run from the App/ directory). Committing this rather than a hand-written
# .xcodeproj keeps project config reviewable and reproducible (a standard
# practice on iOS teams). See SETUP.md for full instructions.
name: Goals
options:
  bundleIdPrefix: com.shariqnaiyer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoalsCore:
    path: ../Packages/GoalsCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # LLM_PROXY_BASE_URL is supplied by Goals/Resources/Secrets.xcconfig (see
    # configFiles below). Left undefined here on purpose: an explicit build
    # setting would override the xcconfig (baseConfiguration has lowest
    # precedence). When the file/value is absent it expands to "" → offline mock.

targets:
  Goals:
    type: application
    platform: iOS
    # Attaches Secrets.xcconfig as the base configuration so Xcode applies
    # LLM_PROXY_BASE_URL. Git-ignored; absent → empty URL → MockLLMService.
    configFiles:
      Debug: Goals/Resources/Secrets.xcconfig
      Release: Goals/Resources/Secrets.xcconfig
    sources:
      - path: Goals
    dependencies:
      - package: GoalsCore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shariqnaiyer.goals
        INFOPLIST_FILE: Goals/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
